version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_KEY=${VITE_API_KEY:-sk-ufnlgmjydarocovcwmymkjdamzgkihbngubrblankjsvyilz}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://api.siliconflow.cn/v1}
        - VITE_API_PROTOCOL=${VITE_API_PROTOCOL:-openai}
    container_name: chat-translate
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
